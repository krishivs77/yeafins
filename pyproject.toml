[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yeafins"
version = "0.1.0"
description = "A style-constrained chess engine personalized from Krishiv Shah's games."
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11",
    "fastapi>=0.115",
    "numpy>=2.0",
    "pydantic>=2.10",
    "torch>=2.6,<3",
    "uvicorn>=0.34",
]

[project.scripts]
yeafins-download = "yeafins.data.download:main"
yeafins-parse = "yeafins.data.parse:main"
yeafins-split = "yeafins.data.split:main"
yeafins-positions = "yeafins.data.positions:main"
yeafins-train = "yeafins.training.train:main"
yeafins-evaluate = "yeafins.training.evaluate:main"
yeafins-play = "yeafins.engine.play:main"
yeafins-evaluate-hybrid = "yeafins.engine.evaluate_hybrid:main"
yeafins-game = "yeafins.engine.game:main"
yeafins-filter-wins = "yeafins.data.filter_wins:main"
yeafins-api = "yeafins.api.app:main"

[project.optional-dependencies]
data = [
    "httpx>=0.28",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "scikit-learn>=1.6",
    "tqdm>=4.67",
]
training = [
    "pandas>=2.2",
    "pyarrow>=18.0",
    "tqdm>=4.67",
]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "scikit-learn>=1.6",
    "tqdm>=4.67",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
