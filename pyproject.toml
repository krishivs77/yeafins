[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yeafins"
version = "0.1.0"
description = "A style-constrained chess engine personalized from Krishiv Shah's games."
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11",
    "httpx>=0.28",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "scikit-learn>=1.6",
    "torch>=2.6",
    "tqdm>=4.67",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true